<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="32" height="32" role="img" aria-label="Wicket">
  <!--
    The Wicket postmark: a circular date stamp broken at the lower left — the
    wicket you pass through single file — with killer bars trailing off it,
    the cancellation that marks an item as accepted and processed.

    The ring is a dashed circle rather than an arc path, so the break is a
    rotation and can never drift with its endpoints: r=32 gives a
    circumference of 201.06, a 40-unit gap is 71.6 degrees, and +171 degrees
    puts that gap at the lower left. The bars trail the stamp rather than
    cutting through it — crossing them into the ring reads as a currency
    glyph. At this scale the middle bar is dropped so the ring stays open.
  -->
  <rect width="128" height="128" rx="24" fill="#5B3E8C"/>
  <circle cx="44" cy="64" r="32" fill="none" stroke="#F4F2E9" stroke-width="8.5"
          stroke-dasharray="161 40" transform="rotate(171 44 64)"/>
  <g fill="#F4F2E9">
    <rect x="72" y="51.75" width="48" height="8.5" rx="1"/>
    <rect x="72" y="67.75" width="48" height="8.5" rx="1"/>
  </g>
</svg>
