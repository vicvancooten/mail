<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      `viewport-fit=cover` lets the layout paint under the iOS notch/home
      indicator instead of stopping short of it; `mail.css`'s safe-area
      padding (#44) is what actually keeps content clear of that area.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Pre-paint (#287): applies the stored appearance — and creates the
      single `<meta name="theme-color">` the browser's own chrome reads —
      before `main.tsx` or anything else loads, so the chrome and the
      document root never flash the OS default first on a cold load.
      Appearance is a Device Preference in `localStorage`
      (`theme/device-theme.ts`), which no `prefers-color-scheme` media query
      can see, so this reads that key directly rather than relying on one.

      Literal source lives in `src/theme/pre-paint.ts`'s `PRE_PAINT_SCRIPT`
      (a test there pins this exact text to it, and evaluates it against a
      bare `document` with no bundle loaded — this file can't import that
      module, since nothing here runs through a bundler). Below 768px (R1,
      `docs/design/polish-pass.md` — this file's own phone breakpoint minus
      one, `@mail/design-tokens#phoneBreakpoint`) the colours are
      `--color-bg`, the translucent header's own backdrop
      (`router/shell.css`'s `.app-header`); at or above it, they're
      `--color-surface-strong`, the opaque desktop header's ground — literal
      hex either way because a meta tag can't read a custom property; keep
      these in step with `HUB_COLOR`/`HUB_COLOR_PHONE`
      (`theme/device-theme.ts`) if either ever moves. `manifest.webmanifest`
      carries no `theme_color` of its own any more (R1's Android step 2,
      `theme/device-theme.ts`'s own doc comment on why) — an installed
      Android WebAPK paints its status bar from the manifest at install time
      and can ignore every later meta change, so leaving that key out is
      what lets it follow this script's own colour instead.
    -->
    <script>
      (function () {
        var stored, theme, dark, phone, meta, palette;
        try {
          stored = localStorage.getItem("device.theme");
          theme = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          phone = matchMedia("(max-width: 767px)").matches;
          document.documentElement.classList.toggle("light", theme === "light");
          document.documentElement.classList.toggle("dark", theme === "dark");
          meta = document.querySelector('meta[name="theme-color"]');
          if (!meta) {
            meta = document.createElement("meta");
            meta.setAttribute("name", "theme-color");
            document.head.appendChild(meta);
          }
          palette = phone
            ? (dark ? "#0c0d10" : "#fbfbfc")
            : (dark ? "#08090b" : "#f5f5f8");
          meta.setAttribute("content", palette);
        } catch (_e) {}
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      iOS/iPadOS ignore `display: standalone` in the manifest below this
      version boundary and rely on these older meta tags instead (still
      honored on current iOS too) — homescreen install is what makes Web
      Push possible there at all (docs/research/0006-ios-pwa-push-badging-constraints.md).
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wicket" />
    <title>Wicket</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
