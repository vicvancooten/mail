<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      `viewport-fit=cover` lets the layout paint under the iOS notch/home
      indicator instead of stopping short of it; `mail.css`'s safe-area
      padding (#44) is what actually keeps content clear of that area.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      The browser's own chrome continues the app's own header rather than
      advertising a brand colour that matches nothing on screen: these are
      `--color-surface-strong` in each theme, the header's own ground
      (@mail/design-tokens; `router/shell.css`'s `.app-header`). Literal
      hex because a meta tag cannot read a custom property — keep them in
      step with the token, and with `theme/device-theme.ts`'s own copy, if
      it ever moves.

      These two are the *cold-load* answer only, and they are right for
      `system` alone: Appearance is a Device Preference in `localStorage`
      (`theme/device-theme.ts`), which no media query can see. `applyTheme`
      rewrites both `content` values from the appearance actually chosen —
      before the first paint, from `main.tsx` — so a light app on a dark OS
      no longer sits under near-black browser chrome. `manifest.webmanifest`
      carries the light value in `theme_color`, since a manifest can only
      hold one and an installed window paints it before any script runs.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#08090b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      iOS/iPadOS ignore `display: standalone` in the manifest below this
      version boundary and rely on these older meta tags instead (still
      honored on current iOS too) — homescreen install is what makes Web
      Push possible there at all (docs/research/0006-ios-pwa-push-badging-constraints.md).
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wicket" />
    <title>Wicket</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
