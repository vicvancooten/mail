# Dev infra only — Postgres and a local IMAP/SMTP test server (GreenMail).
# The app itself runs on the host for a fast reload loop:
#
#   docker compose -f compose.dev.yaml up -d
#   cp .env.example .env   # once
#   pnpm db:migrate
#   pnpm dev:backend        # Fastify on MAIL_BIND, tsx watch
#   pnpm dev:client          # Vite dev server, separate port
#
# GreenMail dynamically accepts any user@localhost / any password for IMAP
# and SMTP — point a Mail Account at IMAP_TEST_HOST:IMAP_TEST_PORT (no TLS).
# CONDSTORE/QRESYNC coverage is unverified as of this scaffold; confirm
# before relying on it for delta-sync tests (see docs/dev-setup.md).

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mail}
      POSTGRES_DB: ${POSTGRES_DB:-mail}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

  imap-test:
    image: greenmail/standalone:2.1.8
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.imap
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.users.login=email
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled
        -Dgreenmail.verbose
    ports:
      - "${IMAP_TEST_PORT:-3143}:3143"
      - "${SMTP_TEST_PORT:-3025}:3025"

volumes:
  pgdata-dev:
